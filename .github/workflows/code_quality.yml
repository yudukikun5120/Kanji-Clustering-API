name: Code Quality

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

permissions:
  contents: read

jobs:
  ruff:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v7
    
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-suffix: lint
      
    - name: Install ruff only
      run: uv tool install ruff
      
    - name: Run Ruff linter
      run: ruff check .
      
    - name: Run Ruff formatter
      run: ruff format --check .

  mypy:
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v7
    
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-suffix: lint
      
    - name: Run mypy
      run: uv run --group lint mypy src/kanji_clustering_api

  pytest:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v7
    
    - name: Set up Python
      uses: actions/setup-python@v7
      with:
        python-version: '3.12'
    
    - name: Install uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
        cache-dependency-glob: "pyproject.toml"
      
    - name: Install dependencies
      run: uv sync --group dev
      
    - name: Run pytest
      run: uv run coverage run -m pytest
    - name: Generate coverage reports
      if: always()
      run: |
        uv run coverage report
        uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"
        uv run coverage html
        uv run coverage xml
    - name: Upload coverage reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: coverage
        path: coverage/
        retention-days: 14
        if-no-files-found: error
    - name: Upload coverage to Codecov
      if: ${{ !cancelled() && hashFiles('coverage/coverage.xml') != '' }}
      uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
      with:
        files: coverage/coverage.xml
        disable_search: true
        disable_telem: true
        use_oidc: true
        fail_ci_if_error: true
